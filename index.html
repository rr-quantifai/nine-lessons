<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nine Lessons I Vedic astrology teachings</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-snap-type: y mandatory; }
  html, body { background: #000; }
  body { color: #fff; -webkit-font-smoothing: antialiased; }

  #bg {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0; display: block;
  }

  #journey {
    position: relative; z-index: 1;
    max-width: 600px; margin: 0 auto;
  }

  section {
    height: 100vh; height: 100dvh;
    scroll-snap-align: start;
    display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center;
    text-align: center;
    padding: 0 28px calc(12vh + env(safe-area-inset-bottom, 0px));
  }

  .name {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(30px, 9vw, 44px);
    font-weight: 400; letter-spacing: 0.14em;
    margin-bottom: 14px;
  }
  .teaching {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-weight: 300; font-size: clamp(15px, 4.2vw, 18px);
    letter-spacing: 0.06em; line-height: 1.6;
    color: rgba(255,255,255,0.82);
    max-width: 30ch;
  }

  .chevron {
    position: absolute; left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    width: 14px; height: 14px;
    border-right: 1.5px solid rgba(255,255,255,0.55);
    border-bottom: 1.5px solid rgba(255,255,255,0.55);
    transform: translateX(-50%) rotate(45deg);
    animation: bob 2s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateX(-50%) rotate(45deg) translate(0,0); opacity:.55 }
    50%     { transform: translateX(-50%) rotate(45deg) translate(4px,4px); opacity:1 }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main id="journey"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const DATA = [
    { name:'Ketu',    text:"Learn to say no to people sometimes",            kind:'node',  glow:0x8877cc },
    { name:'Mercury', text:"Do not speak unnecessarily among people",        kind:'rock',  base:'#8f8a82', spot:'#5c5750' },
    { name:'Saturn',  text:"Maintain discipline in life",                    kind:'gas',   ring:true, palette:['#d8c9a3','#c2ad84','#e6dcbf','#b39a72','#cdbb95'] },
    { name:'Venus',   text:"Wear good and clean clothes",                    kind:'venus' },
    { name:'Jupiter', text:"Do not give free advice to everyone",            kind:'gas',   palette:['#c9a97e','#a67c52','#e8d5b5','#8a5a3b','#d9bf95','#b0876a'] },
    { name:'Mars',    text:"Keep your body fit",                             kind:'rock',  base:'#b5563a', spot:'#7d3a26' },
    { name:'Moon',    text:"Do not remain emotionally attached to everyone", kind:'rock',  base:'#bdbdbd', spot:'#8a8a8a' },
    { name:'Sun',     text:"Do not be available to everyone at all times",   kind:'sun',   glow:0xffaa33 },
    { name:'Rahu',    text:"Do not develop any kind of addiction",           kind:'node',  glow:0x9955aa },
  ];

  // ---------- DOM ----------
  const main = document.getElementById('journey');
  DATA.forEach((p,i)=>{
    const s = document.createElement('section');
    s.innerHTML = '<h2 class="name">'+p.name+'</h2><p class="teaching">'+p.text+'</p>'
                + (i===0 ? '<div class="chevron"></div>' : '');
    main.appendChild(s);
  });

  // ---------- Renderer ----------
  const canvas = document.getElementById('bg');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000004, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
  camera.position.set(0, 0.35, 3.1);

  scene.add(new THREE.AmbientLight(0xffffff, 0.28));
  const key = new THREE.DirectionalLight(0xffffff, 1.15);
  key.position.set(3, 4, 5);
  scene.add(key);

  // ---------- Starfield ----------
  let stars;
  (function(){
    const n = 1500, pos = new Float32Array(n*3);
    for (let i=0;i<n;i++){
      const r = 20 + Math.random()*30;
      const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
      pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
      pos[i*3+1] = r*Math.cos(ph);
      pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    stars = new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:0.05, sizeAttenuation:true, transparent:true, opacity:0.85 }));
    scene.add(stars);
  })();

  // ---------- Procedural textures ----------
  function makeCtx(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c.getContext('2d'); }
  function speckle(ctx,w,h,n,a){
    for(let i=0;i<n;i++){
      ctx.fillStyle = 'rgba('+(Math.random()<0.5?'0,0,0':'255,255,255')+','+(Math.random()*a)+')';
      ctx.fillRect(Math.random()*w, Math.random()*h, 1.5, 1.5);
    }
  }
  function toTex(ctx){ const t=new THREE.CanvasTexture(ctx.canvas); t.anisotropy=2; return t; }

  function gasTexture(palette){
    const w=512,h=256,ctx=makeCtx(w,h);
    for(let y=0;y<h;y++){
      const t=y/h;
      const wob = 0.9*Math.sin(t*34) + 0.5*Math.sin(t*77+2) + 0.3*Math.sin(t*13);
      let idx = Math.floor(t*palette.length*1.6 + wob*0.6);
      idx = ((idx%palette.length)+palette.length)%palette.length;
      ctx.fillStyle = palette[idx];
      ctx.fillRect(0,y,w,1);
    }
    // soften bands
    ctx.globalAlpha = 0.12;
    for(let i=0;i<6;i++) ctx.drawImage(ctx.canvas, 0, (Math.random()-0.5)*4);
    ctx.globalAlpha = 1;
    // storm ovals
    for(let i=0;i<5;i++){
      const x=Math.random()*w, y=h*0.25+Math.random()*h*0.5, r=6+Math.random()*14;
      const g=ctx.createRadialGradient(x,y,1,x,y,r);
      g.addColorStop(0,'rgba(120,70,50,0.45)'); g.addColorStop(1,'rgba(120,70,50,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y,r*1.6,r,0,0,7); ctx.fill();
    }
    speckle(ctx,w,h,1500,0.05);
    return toTex(ctx);
  }

  function rockTexture(base, spot){
    const w=512,h=256,ctx=makeCtx(w,h);
    ctx.fillStyle=base; ctx.fillRect(0,0,w,h);
    // large tonal blotches
    for(let i=0;i<26;i++){
      const x=Math.random()*w,y=Math.random()*h,r=20+Math.random()*70;
      const g=ctx.createRadialGradient(x,y,1,x,y,r);
      const dark = Math.random()<0.5;
      g.addColorStop(0, dark?'rgba(0,0,0,0.16)':'rgba(255,255,255,0.10)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    }
    // craters
    for(let i=0;i<48;i++){
      const x=Math.random()*w, y=Math.random()*h, r=2+Math.random()*9;
      ctx.fillStyle=spot; ctx.globalAlpha=0.55;
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
      ctx.globalAlpha=0.35; ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(x-r*0.15,y-r*0.15,r*0.85,0,7); ctx.stroke();
      ctx.globalAlpha=1;
    }
    speckle(ctx,w,h,2500,0.08);
    return toTex(ctx);
  }

  function sunTexture(){
    const w=512,h=256,ctx=makeCtx(w,h);
    ctx.fillStyle='#ff8c00'; ctx.fillRect(0,0,w,h);
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<160;i++){
      const x=Math.random()*w,y=Math.random()*h,r=4+Math.random()*22;
      const g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba(255,240,180,0.5)');
      g.addColorStop(0.5,'rgba(255,170,40,0.25)');
      g.addColorStop(1,'rgba(255,120,0,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
    for(let i=0;i<40;i++){ // dark granulation
      const x=Math.random()*w,y=Math.random()*h,r=2+Math.random()*6;
      ctx.fillStyle='rgba(180,60,0,0.25)';
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    }
    return toTex(ctx);
  }

  function venusTexture(){
    const w=512,h=256,ctx=makeCtx(w,h);
    ctx.fillStyle='#d9c08f'; ctx.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=2){
      const t=y/h;
      ctx.fillStyle = 'rgba('+(230+Math.sin(t*25)*15|0)+','+(205+Math.sin(t*18+1)*20|0)+','+(160+Math.sin(t*30)*18|0)+',0.35)';
      const off = Math.sin(t*12)*18;
      ctx.fillRect(0,y+off*0.1,w,2);
    }
    for(let i=0;i<20;i++){ // soft swirls
      const x=Math.random()*w,y=Math.random()*h,r=15+Math.random()*50;
      const g=ctx.createRadialGradient(x,y,1,x,y,r);
      g.addColorStop(0,'rgba(255,245,220,0.18)'); g.addColorStop(1,'rgba(255,245,220,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y,r*1.8,r*0.7,Math.random(),0,7); ctx.fill();
    }
    speckle(ctx,w,h,1000,0.04);
    return toTex(ctx);
  }

  function smokeTexture(){
    const w=512,h=256,ctx=makeCtx(w,h);
    ctx.fillStyle='#0b0b14'; ctx.fillRect(0,0,w,h);
    for(let i=0;i<90;i++){
      const x=Math.random()*w,y=Math.random()*h,r=8+Math.random()*45;
      const g=ctx.createRadialGradient(x,y,1,x,y,r);
      const v=20+Math.random()*35|0;
      g.addColorStop(0,'rgba('+v+','+(v-4)+','+(v+14)+',0.5)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    }
    speckle(ctx,w,h,1200,0.05);
    return toTex(ctx);
  }

  function ringTexture(){
    const s=512,ctx=makeCtx(s,s),c=s/2;
    for(let r=s*0.30;r<s*0.48;r+=2){
      const a = 0.06 + 0.30*Math.abs(Math.sin(r*0.22)) * (Math.random()*0.5+0.5);
      ctx.strokeStyle='rgba(216,201,163,'+a.toFixed(3)+')';
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(c,c,r,0,7); ctx.stroke();
    }
    return toTex(ctx);
  }

  // ---------- Planets ----------
  const sphereGeo = new THREE.SphereGeometry(1, 48, 32);
  const BASE_Y = 0.62;
  const planets = [];

  DATA.forEach((cfg,i)=>{
    const group = new THREE.Group();
    const mats = [];   // {m, base} pairs for fading
    let mat, tex;

    if (cfg.kind==='sun'){
      tex = sunTexture();
      mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true });
    } else if (cfg.kind==='node'){
      tex = smokeTexture();
      mat = new THREE.MeshStandardMaterial({ map:tex, roughness:1, metalness:0, transparent:true });
    } else if (cfg.kind==='gas'){
      tex = gasTexture(cfg.palette);
      mat = new THREE.MeshStandardMaterial({ map:tex, roughness:0.95, metalness:0, transparent:true });
    } else if (cfg.kind==='venus'){
      tex = venusTexture();
      mat = new THREE.MeshStandardMaterial({ map:tex, roughness:0.9, metalness:0, transparent:true });
    } else {
      tex = rockTexture(cfg.base, cfg.spot);
      mat = new THREE.MeshStandardMaterial({ map:tex, roughness:1, metalness:0, transparent:true });
    }
    const mesh = new THREE.Mesh(sphereGeo, mat);
    group.add(mesh);
    mats.push({ m:mat, base:1 });

    // glow / rim for Sun and shadow nodes
    if (cfg.kind==='sun' || cfg.kind==='node'){
      const gm = new THREE.MeshBasicMaterial({
        color: cfg.glow, transparent:true,
        opacity: cfg.kind==='sun' ? 0.30 : 0.18,
        side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite:false
      });
      const glow = new THREE.Mesh(sphereGeo, gm);
      glow.scale.setScalar(cfg.kind==='sun' ? 1.25 : 1.12);
      group.add(glow);
      mats.push({ m:gm, base:gm.opacity });
    }

    // Saturn ring
    if (cfg.ring){
      const rm = new THREE.MeshBasicMaterial({ map:ringTexture(), transparent:true, depthWrite:false, side:THREE.DoubleSide });
      const ring = new THREE.Mesh(new THREE.PlaneGeometry(3.6,3.6), rm);
      ring.rotation.x = -1.25;
      ring.rotation.y = 0.25;
      group.add(ring);
      mats.push({ m:rm, base:1 });
    }

    group.position.set(0, BASE_Y, 0);
    group.visible = false;
    group.userData = {
      mats,
      spin: 0.05 + Math.random()*0.06,
      bobSpeed: 0.5 + Math.random()*0.3,
      phase: i*1.37,
      phase2: i*2.11,
      tiltPhase: i*0.77,
      baseScale: cfg.ring ? 0.82 : (cfg.kind==='sun' ? 1.05 : 0.95)
    };
    scene.add(group);
    planets.push(group);
  });

  // ---------- Sizing ----------
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Animation ----------
  const clock = new THREE.Clock();
  const ease = t => t*t*(3-2*t);
  let raf = null;

  function frame(){
    raf = requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    const time = clock.elapsedTime;

    const vh = window.innerHeight;
    const t = (document.scrollingElement.scrollTop || 0) / vh;

    stars.rotation.y += dt*0.004;
    stars.rotation.x += dt*0.0015;

    for (let i=0;i<planets.length;i++){
      const g = planets[i], u = g.userData;
      const d = Math.abs(t - i);
      const presence = Math.max(0, 1 - d*1.35);
      if (presence <= 0.01){ g.visible = false; continue; }
      g.visible = true;
      const p = ease(presence);

      g.scale.setScalar(u.baseScale * (0.55 + 0.45*p));
      for (const e of u.mats) e.m.opacity = e.base * p;

      // gentle damped float
      g.position.y = BASE_Y + Math.sin(time*u.bobSpeed + u.phase)*0.055;
      g.position.x = Math.sin(time*u.bobSpeed*0.63 + u.phase2)*0.04;
      g.rotation.y += u.spin*dt;
      g.rotation.z = 0.04*Math.sin(time*0.3 + u.tiltPhase);
    }
    renderer.render(scene, camera);
  }

  function start(){ if (raf===null){ clock.getDelta(); frame(); } }
  function stop(){ if (raf!==null){ cancelAnimationFrame(raf); raf=null; } }
  document.addEventListener('visibilitychange', ()=> document.hidden ? stop() : start());
  start();
})();
</script>
</body>
</html>
